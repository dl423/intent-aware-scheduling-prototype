[project]
name = "intent-aware-scheduler"
version = "0.1.0"
description = "Intent-aware scheduling gateway prototype for agentic LLM workloads"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116",
  "openai>=1.99",
  "pydantic>=2.11",
  "python-dotenv>=1.1",
  "uvicorn>=0.35",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28",
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
]

[project.scripts]
intent-scheduler = "intent_scheduler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intent_scheduler"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
